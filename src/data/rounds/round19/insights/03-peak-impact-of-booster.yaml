id: peak-impact-of-booster
title: Boosters also reduce hospitalization over time, including much reduced second peak 
order: 3
summary: The models suggest that booters don't significantly change the timing of the two peaks for incident hospitalization. However, boosters will decrease hospitalizations throughout the modeled time period with the largest decreases seen during the second winter peak.
description: >
  Note the difference in peak hospitalization for the two scenarios. Looking at the <span data-annotation-ref="time of max w no booster" style="color:#993366">time of peak hospitalizations</span>, we see the <span data-annotation-ref="max w no booster" style="color:#00abc7">projected peak hospitalizations</span> in the _No booster scenario_ exceeds that of the _65+ and high-risk booster scenario_ by about 14,600.

  - **Two peaks similar to last winter’s peak** (~20,000 hospitalizations at peak) are projected for late August 2025 and January 2026.

  - **648,000 cumulative hospitalizations (95% PI 241,000–778,000) and 40,000 deaths (95% PI 25,000-59,000)** due to COVID-19 projected from April 27, 2025 to April 25, 2026 in the high-risk vaccination scenario (i.e., booster vaccination only among individuals aged 65+ or otherwise at high risk for elevated severity).

  - **The majority of hospitalization and death burden from COVID-19 is expected to occur in individuals 65+**:  56% of hospitalizations and 84% of deaths occur among 65+ in the high-risk vaccination scenario.
