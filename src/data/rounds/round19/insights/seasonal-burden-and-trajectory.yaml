id: seasonal-burden-and-trajectory
title: Season Burden and Trajectory
summary: We expect continued substantial burden of disease from COVID-19 in the US, with two periods of increased COVID-19, in late summer/early fall 2025 and winter 2025-26.
description: >
  First, note that ever so important time <span data-annotation-ref="some-policy-change" style="color:#993366">when that one policy changed</span>.
  We also want to keep the <span data-annotation-ref="value-for-seasonal-burden-and-trajectory-insight" style="color:#663399">Sample Threshold</span> in mind.

  - **Two peaks similar to last winter’s peak** (~20,000 hospitalizations at peak) are projected for late August 2025 and January 2026.

  - **648,000 cumulative hospitalizations (95% PI 241,000–778,000) and 40,000 deaths (95% PI 25,000-59,000)** due to COVID-19 projected from April 27, 2025 to April 25, 2026 in the high-risk vaccination scenario (i.e., booster vaccination only among individuals aged 65+ or otherwise at high risk for elevated severity).

  - **The majority of hospitalization and death burden from COVID-19 is expected to occur in individuals 65+**:  56% of hospitalizations and 84% of deaths occur among 65+ in the high-risk vaccination scenario.
