id: hospitalization-peak
title: Continued COVID-19 burden with two peaks through Winter 2026
order: 1
summary: We expect continued substantial burden of disease from COVID-19 in the US, with two periods of increased COVID-19. The first peak should occur in late summer/early fall 2025, and the second in winter 2025-26.
description: |
  This chart shows the incident hospitalization rate modeled under the assumption that there is no booster recommendation for any population. 
  
  Under this scenario, the model shows two periods of increased burden of disease with peaks in 
  <span data-annotation-ref="Fall Peak" style="color:#3cab00">eary fall</span> and again in <span data-annotation-ref="Winter Peak" style="color:#993366">early winter</span>.

  - **Two peaks similar to last winter’s peak** (~20,000 hospitalizations at peak) are projected for late August 2025 and January 2026.
  - **648,000 cumulative hospitalizations (95% PI 241,000–778,000) and 40,000 deaths (95% PI 25,000-59,000)** due to COVID-19 projected from April 27, 2025 to April 25, 2026 in the high-risk vaccination scenario (i.e., booster vaccination only among individuals aged 65+ or otherwise at high risk for elevated severity).
  - **The majority of hospitalization and death burden from COVID-19 is expected to occur in individuals 65+**:  56% of hospitalizations and 84% of deaths occur among 65+ in the high-risk vaccination scenario.
